# Build official electron (v1.8.4 baseline) through our electron-ci pipeline.
# Driven by legacy/electron-ci (python2, blueprint: ymmuse/electron-ci).
# Pipeline:
#   init.py  -> fetch sources (vendors/, full clone + submodules + LFS)
#            -> copy work copy (electron/)
#            -> apply patches (empty for now) + edit build args (placeholder)
#   build.py -> bootstrap --build_release_libcc -> electron build -> create-dist
# Multi-platform: runners run IN PARALLEL via matrix.
# macos-13 runner was fully retired by GitHub on 2025-12-04; macOS build is
# paused until milestone 1 (official electron v1.8.4 through our ci) is green.
# Electron cannot cross-compile: each platform's dist must be produced by its
# own native runner. Each runner publishes ITS OWN artifacts to GitHub Releases
# (tag per platform + run), not into git history, not a PR.
# No automatic triggers; workflow_dispatch (manual) only.

name: Build custom electron (electron-ci, multi-platform)

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
            python: python2
          - platform: windows
            os: windows-2022
            python: C:/Python27/python.exe
    runs-on: ${{ matrix.os }}
    env:
      TARGET_ARCH: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 2.7 (linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y python2
          python2 --version

      - name: Setup Python 2.7 (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          curl.exe -L -o "$env:TEMP\python2.msi" https://www.python.org/ftp/python/2.7.18/python-2.7.18.amd64.msi
          Start-Process msiexec.exe -ArgumentList "/i `"$env:TEMP\python2.msi`" /qn TARGETDIR=C:\Python27" -Wait
          "C:\Python27" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & "C:\Python27\python.exe" --version

      - name: Init (fetch sources + work copy)
        shell: bash
        run: |
          "${{ matrix.python }}" legacy/electron-ci/init.py

      - name: Build custom electron
        shell: bash
        run: |
          "${{ matrix.python }}" legacy/electron-ci/build.py --target-arch "$TARGET_ARCH"

      - name: Publish to GitHub Releases
        shell: bash
        run: |
          set -e
          SRC="legacy/electron-ci/electron/dist"
          if [ ! -d "$SRC" ]; then
            echo "no dist produced, skip publish"
            exit 0
          fi
          FILES=$(find "$SRC" -maxdepth 1 -type f \( -name "*.zip" -o -name "*.tar.*" -o -name "*.dmg" -o -name "*.pkg" -o -name "*.exe" -o -name "*.msi" \) || true)
          if [ -z "$FILES" ]; then
            echo "no archive files under dist, skip publish"
            exit 0
          fi
          TAG="electron-1.8.4-${{ matrix.platform }}-${{ github.run_id }}"
          gh release create "$TAG" \
            --title "electron 1.8.4 ${{ matrix.platform }} (run ${{ github.run_id }})" \
            --notes "Milestone 1: official electron v1.8.4 baseline built via electron-ci on ${{ matrix.platform }} (x64)."
          gh release upload "$TAG" $FILES
          echo "published to release $TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
