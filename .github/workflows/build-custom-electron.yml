# Build official electron (v4.0.0 baseline) through our electron-ci pipeline.
# electron-ci is a thin wrapper over electron's OWN toolchain:
#   init.py  -> depot_tools + gclient config + gclient sync
#               (locks v4.0.0; DEPS hooks auto-apply official patches,
#                npm install, external binaries download)
#   build.py -> gn gen + ninja -C out/Release electron
# Output: gn-workspace/src/out/Release/electron(.exe) -> GitHub Releases
# (never committed into git). Multi-platform matrix runs in parallel.
# macos-13 runner was fully retired by GitHub on 2025-12-04; macOS build is
# paused until milestone 1 (official electron v4.0.0 through our ci) is green.
# No automatic triggers; workflow_dispatch (manual) only.
#
# NOTE: standard runners have only 14GB disk; chromium source alone (~30GB)
# will NOT fit. This pass is a script-chain validation: init is expected to
# fail at disk capacity. Switch to larger runners (150GB) once confirmed.

name: Build custom electron (electron-ci, multi-platform)

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
            python: python2
          - platform: windows
            os: windows-2022
            python: C:/Python27/python.exe
    runs-on: ${{ matrix.os }}
    env:
      TARGET_ARCH: x64
      # v4.0.0-era chromium needs a local Visual Studio; depot_tools must not
      # try to download the Google-internal toolchain (no access).
      DEPOT_TOOLS_WIN_TOOLCHAIN: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 2.7 (linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y python2
          python2 --version
          # DEPS hooks call `python`; make it resolve to python2 (v4.0.0-era scripts)
          sudo ln -sf /usr/bin/python2 /usr/local/bin/python
          python --version

      - name: Setup Python 2.7 (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          curl.exe -L -o "$env:TEMP\python2.msi" https://www.python.org/ftp/python/2.7.18/python-2.7.18.amd64.msi
          Start-Process msiexec.exe -ArgumentList "/i `"$env:TEMP\python2.msi`" /qn TARGETDIR=C:\Python27" -Wait
          "C:\Python27\python.exe" --version

      - name: Init (gclient: fetch sources + official patches)
        shell: bash
        run: |
          # python2 first in PATH: gclient's DEPS hooks are v4.0.0-era python2 scripts
          if [ "${{ matrix.platform }}" = "windows" ]; then
            export PATH="/c/Python27:$PATH"
          else
            export PATH="/usr/local/bin:$PATH"
          fi
          python --version
          "${{ matrix.python }}" legacy/electron-ci/init.py

      - name: Build custom electron (gn + ninja)
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            export PATH="/c/Python27:$PATH"
          else
            export PATH="/usr/local/bin:$PATH"
          fi
          "${{ matrix.python }}" legacy/electron-ci/build.py --target-arch "$TARGET_ARCH"

      - name: Publish to GitHub Releases
        shell: bash
        run: |
          set -e
          SRC="legacy/electron-ci/gn-workspace/src/out/Release"
          if [ ! -d "$SRC" ]; then
            echo "no build output, skip publish"
            exit 0
          fi
          BIN="electron"
          [ "${{ matrix.platform }}" = "windows" ] && BIN="electron.exe"
          if [ ! -f "$SRC/$BIN" ]; then
            echo "no $BIN produced, skip publish"
            exit 0
          fi
          TAG="electron-4.0.0-${{ matrix.platform }}-${{ github.run_id }}"
          gh release create "$TAG" \
            --title "electron 4.0.0 ${{ matrix.platform }} (run ${{ github.run_id }})" \
            --notes "Milestone 1: official electron v4.0.0 baseline built via electron-ci on ${{ matrix.platform }} (x64)."
          gh release upload "$TAG" "$SRC/$BIN"
          echo "published to release $TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
